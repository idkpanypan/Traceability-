<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D Printed Case Traceability</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');

  body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #0f172a, #2563eb);
    color: #e0e7ff;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }

  .container {
    background: #1e293bdd;
    border-radius: 25px;
    padding: 40px 30px;
    max-width: 450px;
    width: 100%;
    box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    position: relative;
    text-align: center;
  }

  h1 { font-weight: 700; margin-bottom: 30px; font-size: 2rem; }

  .buttons {
    margin-bottom: 25px;
  }

  button {
    background: #2563eb;
    color: #f9fafb;
    border: none;
    border-radius: 12px;
    padding: 12px 20px;
    margin: 0 10px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.3s;
  }
  button:hover { background: #3b82f6; }

  .field { margin-bottom: 18px; text-align: left; }
  .label { font-weight: 600; font-size: 0.85rem; color: #60a5fa; text-transform: uppercase; margin-bottom: 4px; }
  .value { font-size: 1.3rem; font-weight: 500; }
  .status { font-weight: 700; color: #22c55e; font-size: 1.4rem; margin-top: 10px; text-align: center; }
  .notes { margin-top: 20px; font-style: italic; color: #94a3b8; text-align: center; }
</style>
</head>
<body>
  <div class="container">
    <h1>3D Printed Case Traceability</h1>

    <div class="buttons">
      <button onclick="showCase('top')">Top Case</button>
      <button onclick="showCase('bottom')">Bottom Case</button>
    </div>

    <div id="caseInfo">
      <!-- Info will appear here -->
    </div>
  </div>

<script>
  const cases = {
    top: {
      batch: "0007",
      printer: "Bambu Lab P1S",
      material: "PLA White",
      date: "26 March 2026",
      status: "Passed",
      notes: "Top case, 7th print overall"
    },
    bottom: {
      batch: "0008",
      printer: "Bambu Lab P1S",
      material: "PLA White",
      date: "26 March 2026",
      status: "Passed",
      notes: "Bottom case, 8th print overall"
    }
  };

  function showCase(type) {
    const info = cases[type];
    document.getElementById('caseInfo').innerHTML = `
      <div class="field"><div class="label">Batch</div><div class="value">${info.batch}</div></div>
      <div class="field"><div class="label">Printer</div><div class="value">${info.printer}</div></div>
      <div class="field"><div class="label">Material</div><div class="value">${info.material}</div></div>
      <div class="field"><div class="label">Date</div><div class="value">${info.date}</div></div>
      <div class="field"><div class="label">Status</div><div class="value status">${info.status}</div></div>
      <div class="notes">${info.notes}</div>
    `;
  }

  // Show top case info by default
  showCase('top');
</script>
</body>
</html>
