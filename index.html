<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D Printed Case Traceability</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');

body {
  margin:0;
  font-family:'Poppins',sans-serif;
  background: linear-gradient(135deg,#0f172a,#1e40af);
  color:#e0e7ff;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:80vh;
  padding:20px;
  transition: background 0.5s ease;
}

.container {
  border-radius:30px;
  padding:30px 25px;
  max-width:450px;
  width:100%;
  box-shadow:0 25px 50px rgba(0,0,0,0.8);
  text-align:center;
  transition: all 0.5s ease-in-out;
  background:#111f1a; /* darker container background */
}

h1 {
  font-weight:800;
  margin-bottom:15px;
  font-size:2.2rem;
  background: linear-gradient(90deg, #60a5fa, #3b82f6);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: shimmer 3s infinite;
}

@keyframes shimmer {
  0% { background-position: -200% 0; }
  100% { background-position: 200% 0; }
}

.select-text {
  font-size:1rem;
  font-weight:500;
  margin-bottom:15px;
}

.buttons { margin-bottom:25px; }
button {
  border:none;
  border-radius:15px;
  padding:12px 22px;
  margin:0 10px;
  font-weight:600;
  cursor:pointer;
  transition:0.3s;
  box-shadow:0 4px 15px rgba(0,0,0,0.3);
}
button:hover { transform: translateY(-2px); }
button.active { box-shadow:0 6px 25px rgba(255,255,255,0.6); }

.field {
  margin-bottom:12px;
  text-align:left;
  opacity:0;
  transform: translateY(10px);
  transition: all 0.5s ease;
  padding:8px 12px;
  border-radius:10px;
}
.field.show { opacity:1; transform: translateY(0); }
.label { font-weight:600; font-size:0.85rem; text-transform:uppercase; margin-bottom:2px; }
.value { font-size:1.2rem; font-weight:500; color:#f1f5f9; } /* brighter text for visibility */
.status { font-weight:700; font-size:1.3rem; margin-top:8px; text-align:center; text-shadow:0 0 10px;}
.notes { margin-top:15px; font-style:italic; text-align:center; text-shadow:0 0 5px;}

</style>
</head>
<body>
<div class="container" id="container">
  <h1>3D Printed Case Traceability</h1>
  <div class="select-text" id="selectText">Please select a case to view:</div>
  <div class="buttons">
    <button id="topBtn" onclick="showCase('top')">Top Case</button>
    <button id="bottomBtn" onclick="showCase('bottom')">Bottom Case</button>
  </div>
  <div id="caseInfo"></div>
</div>

<script>
const cases = {
  top: {
    themeColor: "#16a34a", // green
    buttonColor: "#22c55e",
    fieldBg: "rgba(22,163,74,0.25)", // darker field background
    batch:"0007",
    printNumber:"4",
    printer:"Bambu Lab P1S",
    material:"PLA White",
    date:"24 Feb 2026",
    duration:"3h",
    layerHeight:"0.12 mm",
    infill:"30%",
    status:"Passed",
    notes:"Top case, 4th print overall"
  },
  bottom: {
    themeColor: "#2563eb", // blue
    buttonColor: "#3b82f6",
    fieldBg: "rgba(37,99,235,0.2)", // darker field background
    batch:"0008",
    printNumber:"7",
    printer:"Bambu Lab P1S",
    material:"PLA White",
    date:"11 Mar 2026",
    duration:"5h",
    layerHeight:"0.12 mm",
    infill:"35%",
    status:"Passed",
    notes:"Bottom case, 7th print overall",
    differenceMeasurement:"1.83 mm"
  }
};

function showCase(type){
  const info = cases[type];
  
  // Update button active states and colors
  document.getElementById('topBtn').classList.remove('active');
  document.getElementById('bottomBtn').classList.remove('active');
  document.getElementById(type+'Btn').classList.add('active');
  document.getElementById('topBtn').style.background = cases.top.buttonColor;
  document.getElementById('bottomBtn').style.background = cases.bottom.buttonColor;
  
  // Update container background
  document.getElementById('container').style.background = "#111f1a"; // keep dark container
  
  // Update select text color
  document.getElementById('selectText').style.color = info.themeColor;

  const container = document.getElementById('caseInfo');
  container.innerHTML = `
    <div class="field" style="background:${info.fieldBg}"><div class="label">Batch</div><div class="value">${info.batch}</div></div>
    <div class="field" style="background:${info.fieldBg}"><div class="label">Print Number</div><div class="value">${info.printNumber}</div></div>
    <div class="field" style="background:${info.fieldBg}"><div class="label">Printer</div><div class="value">${info.printer}</div></div>
    <div class="field" style="background:${info.fieldBg}"><div class="label">Material</div><div class="value">${info.material}</div></div>
    <div class="field" style="background:${info.fieldBg}"><div class="label">Date</div><div class="value">${info.date}</div></div>
    <div class="field" style="background:${info.fieldBg}"><div class="label">Duration</div><div class="value">${info.duration}</div></div>
    <div class="field" style="background:${info.fieldBg}"><div class="label">Layer Height</div><div class="value">${info.layerHeight}</div></div>
    <div class="field" style="background:${info.fieldBg}"><div class="label">Infill</div><div class="value">${info.infill}</div></div>
    ${info.differenceMeasurement ? `<div class="field" style="background:${info.fieldBg}"><div class="label">Difference Measurement</div><div class="value">${info.differenceMeasurement}</div></div>` : ''}
    <div class="field" style="background:${info.fieldBg}"><div class="label">Status</div><div class="value status">${info.status}</div></div>
    <div class="notes" style="color:${info.themeColor}">${info.notes}</div>
  `;
  
  // Animate fields
  const fields = container.querySelectorAll('.field');
  fields.forEach((f,i)=>setTimeout(()=>f.classList.add('show'), i*100));
}

// Show bottom case by default
showCase('bottom');
</script>
</body>
</html>
