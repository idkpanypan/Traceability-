<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>3D Printed Case Traceability</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');

    /* Reset */
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #1f2937, #3b82f6);
      color: #f9fafb;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #111827;
      border-radius: 20px;
      padding: 40px 30px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      text-align: center;
      transition: transform 0.3s ease;
    }
    .card:hover {
      transform: translateY(-10px);
      box-shadow: 0 30px 60px rgba(59, 130, 246, 0.5);
    }
    h1 {
      font-weight: 600;
      margin-bottom: 30px;
      font-size: 1.8rem;
      letter-spacing: 1.5px;
    }
    .field {
      margin-bottom: 18px;
    }
    .label {
      font-weight: 600;
      font-size: 0.9rem;
      color: #93c5fd;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      margin-bottom: 6px;
    }
    .value {
      font-size: 1.2rem;
      font-weight: 400;
      color: #e0e7ff;
    }
    .status {
      font-weight: 700;
      font-size: 1.3rem;
      color: #22c55e;
      margin-top: 20px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      user-select: none;
    }
    .notes {
      margin-top: 25px;
      font-style: italic;
      color: #94a3b8;
      font-size: 0.9rem;
      user-select: text;
    }
    @media (max-width: 480px) {
      .card {
        padding: 30px 20px;
        max-width: 100%;
      }
      h1 {
        font-size: 1.5rem;
      }
      .value {
        font-size: 1.1rem;
      }
    }
  </style>
</head>
<body>
  <div class="card" role="main" aria-label="3D printed case traceability information">
    <h1>3D Printed Case Traceability</h1>
    
    <div class="field">
      <div class="label">Batch</div>
      <div class="value">0007</div>
    </div>

    <div class="field">
      <div class="label">Printer</div>
      <div class="value">Bambu Lab P1S</div>
    </div>

    <div class="field">
      <div class="label">Material</div>
      <div class="value">PLA Black</div>
    </div>

    <div class="field">
      <div class="label">Date</div>
      <div class="value">26 March 2026</div>
    </div>

    <div class="field">
      <div class="label">Status</div>
      <div class="value status">Passed</div>
    </div>

    <div class="notes" aria-label="Additional notes about the batch">
      First production batch
    </div>
  </div>
</body>
</html>
